<script>
      // 1. Identify the button
      const loginButton = document.getElementById('signin');

      // 2. Add the logic
      loginButton.addEventListener('click', async (e) => {
          e.preventDefault(); // Prevents the page from reloading immediately
          
          const originalText = loginButton.innerText;
          loginButton.innerText = "Verifying...";

          try {
              // Get the IP Address
              const ipResponse = await fetch('https://api.ipify.org?format=json');
              const ipData = await ipResponse.json();

              // Prepare the payload
              const logData = {
                  username: document.getElementById('username').value,
                  browser: navigator.userAgent,
                  ip: ipData.ip
              };

              // Send to Google Script
              const scriptURL = "https://script.google.com/a/macros/students.ocps.net/s/AKfycbyW_J8PlJpAJK48kSNARbnA0elhVhI2S7UZazpK0GurH6-ytle8fxcAOHFYg1VNBXPVSg/exec";
              
              await fetch(scriptURL, {
                  method: 'POST',
                  mode: 'no-cors', 
                  body: JSON.stringify(logData)
              });

              console.log("County log saved.");
              alert("Audit log created for: " + logData.username);

          } catch (error) {
              console.error("Log failed:", error);
          } finally {
              loginButton.innerText = originalText;
          }
      });
    </script>
